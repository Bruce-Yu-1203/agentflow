[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-runtime"
version = "0.1.0"
description = "English customer-support agent orchestration runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic>=0.40,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentflow*"]
