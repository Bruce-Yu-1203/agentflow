services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build:
      context: ..
      dockerfile: services/python/Dockerfile
    environment:
      AGENTFLOW_ENV: ${AGENTFLOW_ENV:-development}
      AGENTFLOW_MODEL_API_KEY: ${AGENTFLOW_MODEL_API_KEY:-}
      AGENTFLOW_MODEL_NAME: ${AGENTFLOW_MODEL_NAME:-claude-sonnet-5-5}
      AGENTFLOW_MODEL_BASE_URL: ${AGENTFLOW_MODEL_BASE_URL:-}
      AGENTFLOW_EMBEDDING_PROVIDER: ${AGENTFLOW_EMBEDDING_PROVIDER:-local}
      AGENTFLOW_EMBEDDING_API_KEY: ${AGENTFLOW_EMBEDDING_API_KEY:-}
      AGENTFLOW_EMBEDDING_BASE_URL: ${AGENTFLOW_EMBEDDING_BASE_URL:-}
      AGENTFLOW_REDIS_URL: redis://redis:6379/0
      AGENTFLOW_CHROMA_HOST: chroma
      AGENTFLOW_CHROMA_PORT: "8000"
      AGENTFLOW_SKILLS_DIR: /app/skills
      AGENTFLOW_MCP_CONFIG: /app/config/mcp_servers.json
      AGENTFLOW_MCP_ALLOWED_HOSTS: ${AGENTFLOW_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
      AGENTFLOW_CORS_ORIGINS: ${AGENTFLOW_CORS_ORIGINS:-}
      AGENTFLOW_API_TOKENS: ${AGENTFLOW_API_TOKENS:-}
      AGENTFLOW_SEED_DEMO_DOCS: "false"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${AGENTFLOW_GATEWAY_BIND:-127.0.0.1}:${AGENTFLOW_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ${AGENTFLOW_PROMETHEUS_CONFIG:-./prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ${AGENTFLOW_METRICS_TOKEN_FILE:-./prometheus.token.example}:/etc/prometheus/metrics.token:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
  chroma_data:
  prometheus_data:
