name: Verify

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e 'services/python[test]'
      - run: .venv/bin/python -B -m unittest discover -s tests -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  release:
    runs-on: ubuntu-latest
    needs: [python, web]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify_stack.sh
